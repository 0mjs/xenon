[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
authors = ["Carbon Software Ltd"]
repository = "https://github.com/0mjs/xenon"

[workspace.dependencies]
xenon_mssql = { path = "crates/xenon_mssql" }
xenon_mysql = { path = "crates/xenon_mysql" }
xenon_ssh = { path = "crates/xenon_ssh" }
xenon_driver = { path = "crates/xenon_driver" }
xenon_postgres = { path = "crates/xenon_postgres" }
xenon_sqlite = { path = "crates/xenon_sqlite" }
xenon_store = { path = "crates/xenon_store" }
xenon_ui = { path = "crates/xenon_ui" }

anyhow = "1"
dirs = "7"
futures-util = "0.3"
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-postgres = "0.7"
security-framework = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }

# The GPUI snapshot that gpui-component 0.7.3 pins; the two must move together.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# `font-kit` is required on macOS; without it GPUI silently renders no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }

gpui-component = { version = "=0.7.3", features = ["tree-sitter-sql"] }

[profile.dev.package."*"]
opt-level = 2
