[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
publish = false

[workspace.dependencies]
xenon_ui = { path = "crates/xenon_ui" }

# Same GPUI snapshot that gpui-component 0.7 pins, so it can be adopted later without a fork.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# `font-kit` is required on macOS; without it GPUI silently renders no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }

[profile.dev.package."*"]
opt-level = 2
