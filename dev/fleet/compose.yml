# Xenon's test fleet: one of every engine Xenon supports, on ports that won't clash with
# databases you already run. Start only what you need:
#
#   dev/fleet/up.sh postgres mysql mariadb
#   dev/fleet/down.sh            # stop everything (data is kept in named volumes)
#
# Every server is seeded from dev/seed on first start. Credentials are throwaway:
# user `xenon`, password `xenon`, database `shop`.
name: xenon-fleet

services:
  postgres:
    # TLS on, with the fleet's own CA (dev/fleet/tls-setup/make.sh): copied in so
    # the key belongs to postgres with mode 0600, as Postgres insists.
    image: postgres:17
    ports: ["127.0.0.1:55432:5432"]
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /tls && cp /tls-src/server.pem /tls-src/server.key /tls-src/ca.pem /tls/ &&
        chown postgres:postgres /tls/* && chmod 600 /tls/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.pem
        -c ssl_key_file=/tls/server.key -c ssl_ca_file=/tls/ca.pem
    environment:
      POSTGRES_USER: xenon
      POSTGRES_PASSWORD: xenon
      POSTGRES_DB: shop
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../seed/out/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./tls:/tls-src:ro
      # `xenon_cert` logs in with its client certificate (mutual TLS).
      - ./tls-setup/postgres-cert-user.sh:/docker-entrypoint-initdb.d/zz-cert-user.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xenon", "-d", "shop"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:53306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: xenon
      MYSQL_USER: xenon
      MYSQL_PASSWORD: xenon
      MYSQL_DATABASE: shop
    command: ["--max-connections=50", "--performance-schema=OFF",
              "--ssl-ca=/tls/ca.pem", "--ssl-cert=/tls/server.pem", "--ssl-key=/tls/server.key"]
    volumes:
      - mysql:/var/lib/mysql
      - ../seed/out/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./tls:/tls:ro
      - ./tls-setup/mysql-cert-user.sql:/docker-entrypoint-initdb.d/zz-cert-user.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uxenon", "-pxenon"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11.4
    ports: ["127.0.0.1:53307:3306"]
    environment:
      MARIADB_ROOT_PASSWORD: xenon
      MARIADB_USER: xenon
      MARIADB_PASSWORD: xenon
      MARIADB_DATABASE: shop
    command: ["--ssl-ca=/tls/ca.pem", "--ssl-cert=/tls/server.pem", "--ssl-key=/tls/server.key"]
    volumes:
      - mariadb:/var/lib/mysql
      - ../seed/out/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./tls:/tls:ro
      - ./tls-setup/mysql-cert-user.sql:/docker-entrypoint-initdb.d/zz-cert-user.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  # x86 only: runs under Rosetta on Apple Silicon. Heavier than the rest (about 1 GB);
  # user `sa`, password `Xenon-fleet-1` (SQL Server insists on a complex one).
  # Seeded by up.sh with sqlcmd, since the image has no init-script folder.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports: ["127.0.0.1:51433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Xenon-fleet-1
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1024"
    volumes:
      - mssql:/var/opt/mssql
      - ../seed/out/mssql.sql:/seed/mssql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Xenon-fleet-1 -C -b -Q 'select 1' -o /dev/null"]
      interval: 3s
      retries: 60

  # An SSH bastion for tunnel tests. Databases are reachable from it by service name
  # (postgres:5432, mysql:3306, mariadb:3306), as a real bastion reaches private hosts.
  # Log in as xenon with password `xenon`, or with dev/fleet/ssh/id_ed25519 (made by up.sh).
  bastion:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh \
         && ssh-keygen -A \
         && adduser -D -s /bin/sh xenon \
         && echo 'xenon:xenon' | chpasswd \
         && { printf '%s\n' 'AllowTcpForwarding yes' 'PasswordAuthentication yes' \
                'AuthorizedKeysFile /etc/ssh/keys/%u.pub' 'StrictModes no'; \
              cat /etc/ssh/sshd_config; } > /tmp/sshd_config \
         && mv /tmp/sshd_config /etc/ssh/sshd_config
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    ports: ["127.0.0.1:52222:22"]
    volumes:
      - ./ssh/id_ed25519.pub:/etc/ssh/keys/xenon.pub:ro

volumes:
  postgres:
  mysql:
  mariadb:
  mssql:
