[package]
name = "xenon_ui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock"] }
lsp-types = { version = "0.97", features = ["proposed"] }
gpui.workspace = true
gpui-component.workspace = true
xenon_driver.workspace = true
xenon_sqlite.workspace = true
xenon_duckdb.workspace = true
xenon_edit.workspace = true
anyhow.workspace = true
xenon_postgres.workspace = true
xenon_mysql.workspace = true
xenon_mssql.workspace = true
xenon_ssh.workspace = true
xenon_store.workspace = true
libc = "0.2"
dirs.workspace = true
rust_xlsxwriter = { version = "0.99.1", default-features = false, features = ["constant_memory"] }
serde_json = "1.0.154"
# Asking GitHub for the latest release.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite.workspace = true
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
