name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, whatever the repo default says.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every driver against a real server of each engine: the shared conformance
  # suite (xenon_driver::conformance) plus each driver's own live tests.
  drivers:
    name: Drivers × real databases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/ci-duckdb.sh

      - name: Start the test fleet
        run: |
          python3 dev/seed/generate.py --size small
          # A throwaway key for the SSH bastion (as dev/fleet/up.sh makes).
          mkdir -p dev/fleet/ssh
          ssh-keygen -q -t ed25519 -N '' -C xenon-fleet -f dev/fleet/ssh/id_ed25519
          # Throwaway certificates for the TLS tests (as up.sh makes).
          dev/fleet/tls-setup/make.sh
          docker compose -f dev/fleet/compose.yml up -d --wait postgres mysql mariadb mssql bastion
          # SQL Server has no init-script folder: load its seed by hand.
          docker compose -f dev/fleet/compose.yml exec -T mssql \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Xenon-fleet-1 -C -b \
            -f 65001 -i /seed/mssql.sql -o /dev/null

      - name: Test drivers
        env:
          XENON_TEST_PG_URL: postgres://xenon:xenon@127.0.0.1:55432/shop
        run: >
          cargo test --locked
          -p xenon_driver -p xenon_sqlite -p xenon_duckdb -p xenon_postgres -p xenon_mysql -p xenon_mssql -p xenon_edit
          -p xenon_ssh
          --no-fail-fast -- --include-ignored

      - name: Server logs
        if: failure()
        run: docker compose -f dev/fleet/compose.yml logs --tail 200

  # The app: formatting, lints and every unit test, on the platform it ships for.
  app:
    name: macOS build, lints and tests
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: scripts/ci-duckdb.sh

      - run: cargo fmt --all --check
      # Known vulnerabilities in what's locked (RustSec): a new one fails the build.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
      # Yanked and unsound crates fail it too; unmaintained ones only warn.
      - run: cargo audit --deny yanked --deny unsound
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # Headless screens that also check the UI's guards (production prompts,
      # Fetch all, scripts rolled back, quit with a transaction open).
      - run: cargo test --locked -p xenon_ui -- --ignored snapshots hardening
      # Saved passwords live in the Keychain.
      - run: cargo test --locked -p xenon_store keychain -- --ignored
