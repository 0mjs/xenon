# cargo audit (run in CI). Each ignored advisory says why it doesn't reach Xenon,
# and goes when the crate that holds it back can move.
[advisories]
ignore = [
    # zip < 9: extracting an archive can set SUID bits, follow or create links out of the
    # target folder. Xenon never extracts: the app only writes zips (rust_xlsxwriter, for
    # Excel export). CI and release builds fetch DuckDB's archive with scripts/ci-duckdb.sh,
    # which checks it against its pinned checksum before unzipping it (with unzip, not the
    # zip crate); only development builds let libduckdb-sys download and extract it. Both
    # crates pin zip 8 / 6 for now.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
